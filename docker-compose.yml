# NOTE: Only conservative Compose syntax is used. Docker Compose v2.10 is supported.
name: homewellness

services:
  mosquitto:
    # Stand-in for AWS IoT Core. Same MQTT protocol.
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2.0.18}
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    # Stand-in for Amazon DynamoDB. Data resets on restart (-inMemory).
    image: ${DYNAMODB_IMAGE:-amazon/dynamodb-local:2.5.2}
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    # NOTE: No healthcheck. The image has no guaranteed shell tools.
    # The worker and the tests retry the connection while DynamoDB starts.

  app:
    build: .
    env_file:
      - .env
    environment:
      # FIXME: Local emulator only. Use an IAM role in AWS. Never commit real keys.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-changeme}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-changeme}
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      dynamodb:
        condition: service_started
    # Healthy means: connected to the broker and subscribed to the topics.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build: .
    profiles: ["test"]
    command: ["pytest", "--cov", "--cov-report=term-missing"]
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro

  itest:
    # Integration tests against Mosquitto and DynamoDB Local. Run with: make itest
    build: .
    profiles: ["test"]
    command: ["pytest", "-m", "integration", "-v"]
    env_file:
      - .env
    environment:
      # FIXME: Local emulator only. Use an IAM role in AWS. Never commit real keys.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-changeme}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-changeme}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      dynamodb:
        condition: service_started
