[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
python_functions = ["should_*"]
addopts = "-ra --strict-markers"
markers = [
    "concurrency: tests that run many callers at the same time",
]

[tool.coverage.run]
source = ["homewellness.models", "homewellness.controllers", "homewellness.views"]
branch = true

[tool.coverage.report]
# Coverage gate applies to models, controllers and views. Stores and services have contract tests.
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
